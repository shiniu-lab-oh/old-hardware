id: LP-001

category: tv_set_top_box_front_panel

original_hardware:
  brand: "欧视达"
  model: "ABS-209B"
  type: "digital_tv_set_top_box"

capabilities:
  display:
    type: seven_segment
    digits: 3
    model: "SM310361K-0"
    common: common_anode
    decimal_point: true
    digit_select:
      signals:
        - D1
        - D2
        - D3
      active: low
    segment_driver:
      type: 74HC164
      segment_active: low
      q_mapping:
        Q0: decimal_point
        Q1: D
        Q2: E
        Q3: A
        Q4: C
        Q5: G
        Q6: F
        Q7: B

  leds:
    count: 2
    sdk_exposed_count: 1
    items:
      - index: 0
        color: red
        controllable: false
        connection: hard_wired_power
      - index: 1
        sdk_index: 0
        color: green
        controllable: true
        signal: LOCK
        active: high

  keys:
    count: 6
    mapping:
      - id: 1
        sdk_key: OLD_PANEL_KEY_1
        original_label: MENU
        q_output: Q2
      - id: 2
        sdk_key: OLD_PANEL_KEY_2
        original_label: CH-
        q_output: Q4
      - id: 3
        sdk_key: OLD_PANEL_KEY_3
        original_label: CH+
        q_output: Q7
      - id: 4
        sdk_key: OLD_PANEL_KEY_4
        original_label: VOL-
        q_output: Q6
      - id: 5
        sdk_key: OLD_PANEL_KEY_5
        original_label: VOL+
        q_output: Q1
      - id: 6
        sdk_key: OLD_PANEL_KEY_6
        original_label: OK
        q_output: Q3

  infrared:
    present: true
    supported: false

  card_slot:
    present: false
    supported: false

interface:
  signals:
    - name: D1
      esp32_gpio: 25
      direction: output
    - name: D2
      esp32_gpio: 26
      direction: output
    - name: D3
      esp32_gpio: 32
      direction: output
    - name: D4
      esp32_gpio: 33
      direction: output
      notes: "Auxiliary indicator bank select"
    - name: CLK
      esp32_gpio: 22
      direction: output
    - name: DATA
      esp32_gpio: 21
      direction: output
    - name: LOCK
      esp32_gpio: 19
      direction: output
      notes: "Green LED control"
    - name: K0
      esp32_gpio: 34
      direction: input
      notes: "Input only; uses panel bias components"
    - name: IR
      esp32_gpio: 35
      direction: input
      notes: "Input only; Old Panel SDK does not expose IR"
    - name: VCC
      voltage: 3.3V
      direction: power
    - name: GND
      direction: ground

controller:
  platform: ESP32

software:
  framework: ESP-IDF
  sdk: Old Panel SDK
  driver: lp001

driver:
  name: lp001
  sdk: old-panel
  status: sdk_verified

status:
  reverse_engineered: true
  display_verified: true
  leds_verified: true
  keys_verified: true
  sdk_integrated: true
  production_ready: false

notes:
  - "参考 GPIO 映射已在通用 30Pin ESP32 开发板上验证。"
  - "IR 硬件存在，但当前 Old Panel SDK 不纳入公共 API。"
